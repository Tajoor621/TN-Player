name: Build APK and deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify and build current branded APK
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Assemble landing page and matching APK
        run: python3 scripts/package-pages.py
      - uses: actions/upload-artifact@v4
        with:
          name: TN-Player-branded-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Deploy landing page and APK
        id: deployment
        uses: actions/deploy-pages@v4
