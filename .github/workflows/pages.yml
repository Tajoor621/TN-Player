name: Build APK and publish verified Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
      - name: Verify and build current branded APK
        run: bash ./gradlew testDebugUnitTest lintDebug assembleDebug --stacktrace
      - name: Assemble landing page and matching APK
        run: python3 scripts/package-pages.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TN-Player-branded-debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: _site
      - name: Require successful Android build and device validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id=$(gh run list --workflow android.yml --commit "$GITHUB_SHA" --limit 1 --json databaseId --jq '.[0].databaseId')
          test -n "$run_id" && test "$run_id" != "null"
          gh run watch "$run_id" --exit-status --interval 10
      - name: Publish APK into the configured main/root source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          mkdir -p downloads
          cp _site/downloads/* downloads/
          cp _site/build-info.json build-info.json
          touch .nojekyll
          git add downloads build-info.json .nojekyll
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Publish tested APK from $GITHUB_SHA [skip ci]"
          git push origin HEAD:main
          gh api --method POST "repos/$GITHUB_REPOSITORY/pages/builds"
  verify:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify public website and APK checksum
        run: python3 scripts/verify-pages.py "https://tajoor621.github.io/TN-Player/" "$GITHUB_SHA"
