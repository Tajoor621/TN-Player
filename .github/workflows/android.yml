name: Android checks and APK
on:
  push:
    branches-ignore: ['dependabot/**']
  pull_request:
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'Build APKs and run device validation after the remaining feature prompts are integrated'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  source-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 2
      - name: Check source and build-script syntax without producing APKs
        run: |
          git diff --check HEAD^
          bash -n scripts/build-native-codecs.sh scripts/install-native-codecs.sh scripts/generate-codec-fixtures.sh scripts/release-codec-check.sh scripts/benchmark.sh scripts/capture-player-gestures.sh
          python3 -m py_compile scripts/package-native-sources.py scripts/package-pages.py scripts/verify-pages.py scripts/codec-size-report.py scripts/generate-benchmark-fixtures.py scripts/benchmark_report.py scripts/test_benchmark_report.py scripts/check-site.py
          python3 scripts/check-site.py
          python3 -m unittest discover -s scripts -p test_benchmark_report.py -v
          python3 -m json.tool software-codecs/native-lock.json >/dev/null
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
      - name: Compile source and tests without producing APKs
        run: |
          tasks=(:app:compileDebugKotlin :app:compileDebugAndroidTestKotlin :app:testDebugUnitTest :app:lintDebug)
          bash ./gradlew "${tasks[@]}" -x :software-codecs:verifyNativeCodecs --dry-run > /tmp/tn-source-tasks.txt
          if grep -Eq '^:app:(package|assemble|install)(Debug|Release)(AndroidTest)?( |$)' /tmp/tn-source-tasks.txt; then
            echo 'Unexpected APK-producing task in source checks; refusing during build deferral.' >&2
            exit 1
          fi
          bash ./gradlew "${tasks[@]}" -x :software-codecs:verifyNativeCodecs --stacktrace
      - name: Summarize source-only validation
        run: |
          python3 - <<'PYREPORT'
          import pathlib, xml.etree.ElementTree as ET
          suites = [ET.parse(p).getroot() for p in pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          print('JVM unit tests:', sum(int(s.get('tests', 0)) for s in suites), 'failures:', sum(int(s.get('failures', 0)) for s in suites), 'errors:', sum(int(s.get('errors', 0)) for s in suites))
          lint = ET.parse('app/build/reports/lint-results-debug.xml').getroot()
          print('Lint errors:', sum(i.get('severity') in ('Error', 'Fatal') for i in lint), 'warnings:', sum(i.get('severity') == 'Warning' for i in lint))
          apks = list(pathlib.Path('app/build').rglob('*.apk'))
          print('APK files produced:', len(apks))
          assert not apks, 'Source-only validation unexpectedly produced an APK'
          PYREPORT
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: source-review-reports
          path: app/build/reports/
  native-codecs:
    if: github.event_name == 'workflow_dispatch' && inputs.build_apk
    needs: source-review
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd
        with:
          packages: 'ndk;27.2.12479018 cmake;3.22.1'
      - run: sudo apt-get update -qq && sudo apt-get install -y yasm ffmpeg
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: native-cache
        with:
          path: .native/dist
          key: native-linux-${{ hashFiles('software-codecs/**', 'scripts/*native*', 'scripts/generate-codec-fixtures.sh') }}
      - name: Build pinned decoder libraries and corresponding source archive
        if: steps.native-cache.outputs.cache-hit != 'true'
        run: bash scripts/build-native-codecs.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: native-codecs
          path: .native/dist/
          include-hidden-files: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: failure()
        with:
          name: native-build-failure-logs
          path: |
            .native/build/**/config.log
            .native/config/
          include-hidden-files: true
  build:
    needs: native-codecs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-codecs
          path: .native/dist
      - run: bash scripts/install-native-codecs.sh
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - run: chmod +x gradlew
      - run: ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease --stacktrace
      - run: python3 scripts/codec-size-report.py
      - name: Record resolved release dependencies
        run: |
          mkdir -p app/build/reports
          bash ./gradlew :app:dependencies --configuration releaseRuntimeClasspath > app/build/reports/release-dependencies.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: TN-Player-1.0.0-debug-APK
          path: app/build/outputs/apk/debug/*.apk
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: validation-reports
          path: |
            app/build/reports/
  emulator:
    needs: native-codecs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [28, 34]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: native-codecs
          path: .native/dist
      - run: bash scripts/install-native-codecs.sh
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          script: |
            bash ./scripts/device-validation.sh
            if [ "${{ matrix.api }}" = "34" ]; then bash ./scripts/release-codec-check.sh; fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: android-device-test-reports-api-${{ matrix.api }}
          path: |
            app/build/reports/androidTests/
            app/build/reports/reference-ui/
            app/build/outputs/androidTest-results/
